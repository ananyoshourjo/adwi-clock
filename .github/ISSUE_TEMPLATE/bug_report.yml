name: Bug report
description: Tell us about something that is not working.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping Adwi Clock get better.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - More than one
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Tap…
        3. See…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, recordings, and device details are helpful.
